title: flakesmith
description: Reproduce, shrink and permanently capture flaky Go tests.
theme: jekyll-theme-cayman
markdown: kramdown

# Cayman is on GitHub Pages' supported-theme list; jekyll-theme-primer is not,
# and an unsupported theme fails the build with a missing-gem error. Before
# changing this, check the theme list in the GitHub Pages docs.
plugins:
  - jekyll-relative-links

# Every docs page carries explicit front matter, so kramdown renders it instead
# of copying raw markdown; relative-links rewrites the .md links between those
# pages to the .html the build emits, which is what keeps ARCHITECTURE.md a
# working link on the site.
relative_links:
  enabled: true
  collections: false

exclude:
  - flakesmith-demo.gif
