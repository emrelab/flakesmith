name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows runner's default shell is pwsh; the steps assume POSIX scripts
    # (make, $(...) capture, ./flakesmith). Pinned to bash in one place.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The tool itself must not produce flakes. A state leak is caught here.
      - name: test (repeat, flake hunt)
        run: go test -count=10 ./...

      - name: fixtures
        run: make fixtures

      - name: build
        run: make build

      - name: smoke (help)
        run: ./flakesmith help
