name: nightly

# The full -count=10 repeat sweep on all three OSes. On PRs ci.yml runs
# -count=3 on the unit/probe packages and the integration layer
# (internal/cli/...) once; a leak that only surfaces on the 7th run, or one
# that needs repeats in the subprocess-driven layer, is the nightly's job.
# Local equivalent: `make test-repeat`.

on:
  schedule:
    - cron: '0 21 * * *' # 00:00 UTC+3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat-sweep:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # Zero dependencies, so there is no module cache worth restoring —
          # and v7's default cache looks for go.sum, which this module has not.
          cache: false
      - name: test (full repeat sweep)
        run: go test -timeout 45m -count=10 ./...

  # The ci.yml self-hunt runs with --short so a PR budget is not spent on
  # integration tests. This is the sweep that promise deferred to: no
  # --short, a generous wall budget, the full package set — integration
  # tests included. An order-dependent flake hiding in a slow test is the
  # nightly's to catch, same as a leak on the 7th repeat.
  self-hunt-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # Zero dependencies, so there is no module cache worth restoring —
          # and v7's default cache looks for go.sum, which this module has not.
          cache: false
      - name: build
        run: make build
      - name: hunt our own packages (full)
        run: |
          set -uo pipefail
          rc=0
          ./flakesmith hunt ./... --fail-on-flake --budget 1000 --timeout 40m || rc=$?
          if [ "$rc" -eq 4 ]; then
            echo "::warning::full self-hunt ran out of budget — raise --budget/--timeout or file it"
            exit 0
          fi
          exit "$rc"
      - name: save capsules
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-hunt-capsules
          path: "**/.flakesmith/*.json"
          if-no-files-found: ignore
          retention-days: 14
